<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>canvas</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      html, body { margin: 0; padding: 0; background-color: #0e0f12; }
      #canvas-splash {
        position: fixed; inset: 0;
        background-color: #0e0f12;
        display: flex; align-items: center; justify-content: center;
        z-index: 9999;
        pointer-events: none;
        transition: opacity 450ms ease-out;
      }
      #canvas-splash.canvas-splash-fade { opacity: 0; }
      #canvas-splash-logo {
        width: min(560px, 78vw);
        height: auto;
        overflow: visible;
      }
      .splash-play-fill {
        fill: #4f8ef7;
        opacity: 0;
        transform-box: view-box;
        transform-origin: 270px 88px;
        animation:
          splash-play-pop 0.35s cubic-bezier(.34, 1.45, .64, 1) forwards,
          splash-play-fade 0.15s cubic-bezier(.4, 0, .6, 1) 0.7s forwards;
      }
      .splash-chevron {
        fill: none;
        stroke: #4f8ef7;
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
        opacity: 0;
        animation: splash-chev-in 0.15s cubic-bezier(.4, 0, .6, 1) 0.75s forwards;
      }
      .splash-word {
        fill: #f4f5f7;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 44px;
        font-weight: 500;
        letter-spacing: 3px;
        opacity: 0;
        transform-box: view-box;
        transform-origin: 260px 88px;
        animation: splash-word-in 0.4s cubic-bezier(.22, 1, .36, 1) 1.3s forwards;
      }
      @keyframes splash-play-pop {
        0%   { opacity: 0; transform: scale(.55); }
        60%  { opacity: 1; transform: scale(1.06); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes splash-play-fade { to { opacity: 0; } }
      @keyframes splash-chev-in { to { opacity: 1; } }
      @keyframes splash-word-in {
        0%   { opacity: 0; transform: scaleX(.88) translateY(2px); }
        100% { opacity: 1; transform: scaleX(1)   translateY(0);   }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-play-fill, .splash-chevron, .splash-word { animation: none !important; }
        .splash-play-fill { opacity: 0; }
        .splash-chevron { opacity: 1; }
        .splash-chevron-left  { d: path("M 168 62 L 142 88 L 168 114"); }
        .splash-chevron-right { d: path("M 352 62 L 378 88 L 352 114"); }
        .splash-word { opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="canvas-splash">
      <svg id="canvas-splash-logo" viewBox="0 0 520 160" role="img" aria-labelledby="canvasSplashTitle" preserveAspectRatio="xMidYMid meet">
        <title id="canvasSplashTitle">canvas</title>
        <path class="splash-play-fill" d="M 232 50 L 312 88 L 232 126 Z" />
        <path class="splash-chevron splash-chevron-left" d="M 232 50 L 312 88 L 232 126">
          <animate attributeName="d" begin="0.8s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.42 0 0.18 1"
                   values="M 232 50 L 312 88 L 232 126; M 168 62 L 142 88 L 168 114" />
        </path>
        <path class="splash-chevron splash-chevron-right" d="M 232 50 L 312 88 L 232 126">
          <animate attributeName="d" begin="0.8s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.42 0 0.18 1"
                   values="M 232 50 L 312 88 L 232 126; M 352 62 L 378 88 L 352 114" />
        </path>
        <text class="splash-word" x="260" y="100" text-anchor="middle">canvas</text>
      </svg>
    </div>
    <div id="app"></div>
    <script>
      // Hold the splash for at least one full animation cycle (~2.2s) before
      // letting the app fade it out. App fires 'canvas:ready' once auth
      // resolves — that's usually well under 2s, so without this gate the
      // animation would get cut off mid-morph on fast cold loads. After
      // BOTH the event has fired AND the minimum hold has elapsed, fade.
      (function () {
        var SPLASH_MIN_MS = 1750;
        var startedAt = Date.now();
        var ready = false;
        function dismiss() {
          var el = document.getElementById('canvas-splash');
          if (!el) return;
          el.classList.add('canvas-splash-fade');
          setTimeout(function () {
            el.remove();
            // Tell App it can render now. The form/inputs only mount after
            // this fires, so password-manager extensions don't attach UI
            // (autofill icons, etc.) to inputs while the splash is on top.
            window.dispatchEvent(new Event('canvas:splashGone'));
          }, 500);
        }
        window.addEventListener('canvas:ready', function () {
          ready = true;
          var elapsed = Date.now() - startedAt;
          if (elapsed >= SPLASH_MIN_MS) dismiss();
          else setTimeout(dismiss, SPLASH_MIN_MS - elapsed);
        });
        // Reduced-motion users skip the animation entirely — collapse the
        // minimum hold so they're not staring at a static splash.
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          SPLASH_MIN_MS = 0;
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
