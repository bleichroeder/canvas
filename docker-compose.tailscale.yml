# Canvas via Tailscale Funnel — no port forwarding needed.
#
# Setup:
#   1. Get a Tailscale auth key from https://login.tailscale.com/admin/settings/keys
#      (choose Reusable; disable Ephemeral)
#   2. Copy .env.example to .env and fill in TS_AUTHKEY.
#   3. docker compose -f docker-compose.tailscale.yml up -d
#   4. Your canvas URL is at `docker logs canvas-tailscale`, roughly:
#      `<hostname>.<tailnet>.ts.net`

services:
  canvas:
    image: ghcr.io/dherzfeld/canvas:latest
    container_name: canvas
    restart: unless-stopped
    # Share the Tailscale sidecar's network namespace so 127.0.0.1:8080
    # inside canvas is the same 127.0.0.1:8080 the sidecar forwards its
    # Funnel URL to.
    network_mode: "service:canvas-tailscale"
    volumes:
      - ./canvas-data:/data
    environment:
      TS_FUNNEL_MODE: "1"
      CANVAS_PORT: "8787"
    depends_on:
      - canvas-tailscale

  canvas-tailscale:
    image: tailscale/tailscale:latest
    container_name: canvas-tailscale
    hostname: canvas
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY?"TS_AUTHKEY env var is required — see comments at top of this file"}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: "--advertise-tags=tag:canvas"
      # Publishes the Caddy internal HTTP port (:8080) as a public Funnel HTTPS URL.
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./canvas-tailscale-state:/var/lib/tailscale
      - ./docker/ts-serve.json:/config/serve.json:ro
    cap_add:
      - net_admin
      - sys_module
    devices:
      - /dev/net/tun:/dev/net/tun
