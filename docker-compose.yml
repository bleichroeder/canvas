services:
  canvas:
    image: ghcr.io/bleichroeder/canvas:latest
    container_name: canvas
    restart: unless-stopped
    ports:
      - "8787:8787"
      - "80:80"
      - "443:443"
    volumes:
      - canvas-data:/data
    environment:
      WATCHTOWER_URL: "http://canvas-watchtower:8080"
      WATCHTOWER_TOKEN: "${WATCHTOWER_HTTP_API_TOKEN}"
      # Diagnostic + telemetry knobs — see docs/diagnostics.md
      # TELEMETRY_ENABLED: "true"
      # TELEMETRY_RETENTION_DAYS: "30"
      # TELEMETRY_MAX_ROWS: "1000"
    labels:
      # Opt this container into Watchtower's auto-update watch.
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: canvas-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      # v0.10.0+: click-to-update mode. No polling; canvas triggers updates via /v1/update.
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: "${WATCHTOWER_HTTP_API_TOKEN:?WATCHTOWER_HTTP_API_TOKEN required — see docs/updates.md}"
      WATCHTOWER_CLEANUP: "true"

volumes:
  # `name: canvas-data` overrides docker-compose's default project-prefixed
  # naming (e.g. "canvas_canvas-data") to use the literal name. This is what
  # lets existing users who created `canvas-data` via `docker run -v canvas-data:/data`
  # keep their DB when switching to compose. Fresh installs just create it.
  canvas-data:
    name: canvas-data

