# Bare canvas — HTTP only on :8787. Put your own reverse proxy in front for
# TLS, public hostname, etc. See docs/reverse-proxy-examples/ for recipes.
#
#   docker compose up -d
#   docker compose logs -f canvas

services:
  canvas:
    image: ghcr.io/dherzfeld/canvas:latest
    container_name: canvas
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./canvas-data:/data
